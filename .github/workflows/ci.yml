name: Linux graphics

on:
  push:
    branches: [master, feat/linux-graphics]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-graphics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libfreetype6-dev libfontconfig1-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-0 libgl1-mesa-dri xvfb x11-apps imagemagick chafa python3-pil
      - name: Toolchains
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Format
        run: cargo +nightly fmt --all -- --check
      - name: Tests
        run: |
          cargo test --workspace --locked
          cargo test -p alacritty_terminal --no-default-features --locked
          cargo test -p vte-graphics --no-default-features --locked
      - name: Minimum supported Rust
        run: cargo +1.85.0 clippy --workspace --all-targets --locked
      - name: Build
        run: cargo build --release --locked
      - name: Pixels and Chafa
        run: python3 scripts/graphics-smoke.py --output target/graphics-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-graphics
          path: |
            target/release/alacritty
            target/graphics-smoke

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust cargo cmake pkgconf freetype2 fontconfig libxcb libxkbcommon libxkbcommon-x11 scdoc mesa libglvnd ttf-dejavu xorg-server-xvfb xorg-xwd imagemagick chafa python-pillow
      - uses: actions/checkout@v4
      - name: Build Arch package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && scripts/build-arch-package.sh"
      - name: Package contents
        run: |
          pacman -U --noconfirm target/arch-package/*.pkg.tar.zst
          alacritty --version
          test -f /usr/share/terminfo/a/alacritty
          test -f /usr/share/applications/Alacritty.desktop
      - name: Pixels and Chafa on Arch
        run: python scripts/graphics-smoke.py --binary /usr/bin/alacritty --output target/arch-graphics-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archlinux-graphics
          path: |
            target/arch-package/*.pkg.tar.zst
            target/arch-graphics-smoke
